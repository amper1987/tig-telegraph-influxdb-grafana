# =========================
# TELEGRAF AGENT
# =========================
[agent]
  interval = "${TELEGRAF_COLLECTION_INTERVAL}"
  flush_interval = "${TELEGRAF_COLLECTION_INTERVAL}"
  hostname = "${HOSTNAME}"

# =========================
# SYSTEM METRICS
# =========================
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.disk]]
  mount_points = ["/"]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]
  devices = ["sda", "sdb", "nvme0n1"]
  skip_serial_number = true

[[inputs.net]]
  interfaces = ["eth*", "en*"]
  ignore_protocol_stats = false

# =========================
# MQTT INPUT
# =========================
[[inputs.mqtt_consumer]]
  servers = ["tcp://broker.emqx.io:1883"]
  topics = ["iot/+/mt/msg"]
  qos = 0
  data_format = "json"

# =========================
# FIELD TYPE NORMALIZATION
# =========================
[[processors.converter]]
  [processors.converter.fields]
    float = ["rpm", "temperature", "voltage", "pressure"]

# =========================
# OUTPUT
# =========================
[[outputs.influxdb_v2]]
  urls = ["http://${INFLUXDB_HOST}:8181"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
